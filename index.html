<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ジャービス</title>
<style>
  :root { --bg:#050c14; --panel:#0a1a29; --line:#12425e; --fg:#d7f1fb; --dim:#6f93a8; --cyan:#2fd8ff; --amber:#ffb340; color-scheme: dark; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.6 system-ui, "Noto Sans JP", sans-serif; }
  main { max-width:760px; margin:0 auto; display:grid; gap:12px; }
  h1 { margin:0; letter-spacing:.2em; color:var(--cyan); font-size:18px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:12px; }
  #state { font-weight:700; } #state.on { color:var(--cyan); } #state.wait { color:var(--amber); }
  button, input { font:inherit; } input { width:100%; box-sizing:border-box; background:#06121d; color:var(--fg); border:1px solid var(--line); padding:8px; border-radius:3px; }
  button { background:transparent; color:var(--cyan); border:1px solid var(--cyan); padding:6px 12px; border-radius:3px; cursor:pointer; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; } .dim { color:var(--dim); font-size:12px; }
  #log { display:grid; gap:8px; list-style:none; margin:0; padding:0; } #log li { border-left:2px solid var(--line); padding-left:10px; white-space:pre-wrap; overflow-wrap:anywhere; }
  #log li.me { border-color:var(--cyan); } #log li.bad { border-color:var(--amber); }
  details summary { cursor:pointer; color:var(--dim); }
</style>
</head>
<body>
<main>
  <h1>J.A.R.V.I.S.</h1>
  <div class="panel row"><span id="state" class="wait">停止中</span><button id="toggle" type="button">待機を始める</button><label class="dim"><input id="speak" type="checkbox" checked style="width:auto"> 答えを読み上げる</label></div>
  <div class="panel"><div class="dim">「ジャービス、○○」と話すか、下の欄に入力して Enter。</div><input id="text" type="text" placeholder="例: 今日の状況は？" autocomplete="off"></div>
  <ul id="log" class="panel"></ul>
  <details class="panel"><summary>設定（このブラウザにだけ保存されます）</summary>
    <p class="dim">GitHub のトークン（Actions: 書き込み、Contents: 読み取り、この保管庫だけ）。</p>
    <label>リポジトリ <input id="repo" value="ShogoS13/ai-company-vault"></label>
    <label>トークン <input id="token" type="password" autocomplete="off"></label>
    <p><button id="save" type="button">保存</button></p>
  </details>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
